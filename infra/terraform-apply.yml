name: Terraform Apply

on:
  push:
    branches: [main]
    paths:
      - "infra/**"

permissions:
  id-token: write
  contents: read

env:
  TF_VERSION: "1.9.5"
  WORKING_DIR: infra

jobs:
  apply:
    runs-on: ubuntu-latest
    # "production" environment must exist in repo settings with a required
    # reviewer configured. That reviewer gate is the approval step, not
    # anything in this workflow file.
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.TF_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.TF_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.TF_AZURE_SUBSCRIPTION_ID }}

      - name: Terraform init
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RG }}" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_SA }}" \
            -backend-config="container_name=${{ vars.TFSTATE_CONTAINER }}" \
            -backend-config="key=phase1.tfstate"
        env:
          ARM_USE_OIDC: "true"
          ARM_CLIENT_ID: ${{ secrets.TF_AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.TF_AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.TF_AZURE_SUBSCRIPTION_ID }}

      # Re-plans against main rather than replaying the PR's exact plan
      # file. Simpler to run, small window for drift between PR-time and
      # merge-time state. Acceptable solo; revisit if Phase 2 adds
      # concurrent PRs against the same state.
      - name: Terraform apply
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform apply -input=false -auto-approve
        env:
          ARM_USE_OIDC: "true"
          ARM_CLIENT_ID: ${{ secrets.TF_AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.TF_AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.TF_AZURE_SUBSCRIPTION_ID }}
