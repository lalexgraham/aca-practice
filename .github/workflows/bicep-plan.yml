# .github/workflows/bicep-plan.yml (on pull_request)
#
# The Bicep counterpart of terraform-plan.yml. Runs `what-if` (Bicep's plan)
# on whichever Bicep layers the PR touches and posts each result as a PR
# comment. Deploys nothing. A change under infra/bicep/platform previews the
# platform layer, a change under infra/bicep/environment previews both
# staging and production.
#
# The layers are deployed as deployment stacks, which delete resources
# removed from the template. `what-if` doesn't preview those deletions, so
# each comment also lists them (stack-deletions.sh).
#
# The Bicep stack is a separate set of resources (rg-inspire-bcp) from the
# Terraform one - see infra/bicep/platform/main.bicep.
#
# Logs in as the Terraform identity (AZURE_CLIENT_ID_TERRAFORM): its
# federated credentials match on repo + trigger, not workflow file, so the
# existing pull_request credential covers this workflow too.
#
# Runs on every pull request for the same reason terraform-plan.yml does:
# the `bicep-plan` job below must always report a status, as main's branch
# protection requires it.
name: Bicep plan

on:
  pull_request:

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  BICEP_VERSION: "v0.48.1" # keep in step with bicep-apply.yml
  BICEP_RG: rg-inspire-bcp # rg-<project>, project is set in the .bicepparam files
  BICEP_LOCATION: uksouth # subscription-scope deployments need a location for their metadata
  AZURE_CORE_NO_COLOR: "true" # keep ANSI colour codes out of the PR comments

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.filter.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2 # the PR merge commit plus its parents

      - id: filter
        run: |
          # HEAD is the PR merge commit, HEAD^1 is the base branch.
          changed=$(git diff --name-only HEAD^1 HEAD)
          echo "$changed"

          # bicepconfig.json changes the linter for every layer.
          all=false
          if grep -q '^infra/bicep/bicepconfig.json$' <<< "$changed"; then all=true; fi

          layers=()
          if $all || grep -q '^infra/bicep/platform/' <<< "$changed"; then
            layers+=('{"layer":"platform","dir":"infra/bicep/platform","params":"main.bicepparam"}')
          fi
          if $all || grep -q '^infra/bicep/environment/' <<< "$changed"; then
            layers+=('{"layer":"staging","dir":"infra/bicep/environment","params":"staging.bicepparam"}')
            layers+=('{"layer":"production","dir":"infra/bicep/environment","params":"production.bicepparam"}')
          fi

          matrix="[$(IFS=,; echo "${layers[*]}")]"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  what-if-layer:
    needs: changes
    if: needs.changes.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.changes.outputs.matrix) }}
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_TERRAFORM }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Pinned, and not whichever bicep the runner image has on its PATH.
      - name: Install Bicep CLI
        run: |
          az config set bicep.use_binary_from_path=false --only-show-errors
          az bicep install --version "$BICEP_VERSION"
          az bicep version

      - name: Lint and compile
        run: |
          az bicep lint --file main.bicep
          mkdir -p out
          az bicep build --file main.bicep --outfile out/main.json
          az bicep build-params --file "${{ matrix.params }}" --outfile out/params.json

      - id: what-if
        env:
          LAYER: ${{ matrix.layer }}
        run: |
          # Without pipefail, `az ... | tee` would report tee's success and a
          # failed what-if would pass the check.
          set -o pipefail

          if [ "$LAYER" = "platform" ]; then
            az deployment sub what-if --name "bicep-platform" --location "$BICEP_LOCATION" \
              --template-file out/main.json --parameters out/params.json \
              --exclude-change-types NoChange Ignore 2>&1 | tee plan.txt

            # Same what-if as JSON, to work out what the stack would delete.
            az deployment sub what-if --name "bicep-platform" --location "$BICEP_LOCATION" \
              --template-file out/main.json --parameters out/params.json \
              --no-pretty-print > whatif.json
            bash ../stack-deletions.sh sub bicep-platform whatif.json > deletions.txt
            {
              echo
              echo "Resources the stack would DELETE (no longer in the template):"
              if [ -s deletions.txt ]; then cat deletions.txt; else echo "none"; fi
            } | tee -a plan.txt
            exit 0
          fi

          # The environment layer deploys into the platform's resource group,
          # so there's nothing to preview against until the platform exists
          # (e.g. the PR that introduces both layers).
          if [ "$(az group exists -n "$BICEP_RG")" != "true" ]; then
            echo "Resource group $BICEP_RG doesn't exist yet: the platform layer has to be deployed before $LAYER can be previewed." | tee plan.txt
            exit 0
          fi

          # Bicep's stand-in for Terraform's ignore_changes on the image:
          # preview with the image the app is running now, so a deploy by
          # some other route doesn't show up as a change.
          image=$(az containerapp show -n "aca-app-$LAYER" -g "$BICEP_RG" \
            --query "properties.template.containers[0].image" -o tsv 2>/dev/null || true)
          if [ -n "$image" ]; then
            jq --arg img "$image" '.parameters.containerImage = {value: $img}' out/params.json > out/params.tmp
            mv out/params.tmp out/params.json
          fi

          az deployment group what-if --name "bicep-$LAYER" --resource-group "$BICEP_RG" \
            --template-file out/main.json --parameters out/params.json \
            --exclude-change-types NoChange Ignore 2>&1 | tee plan.txt

          az deployment group what-if --name "bicep-$LAYER" --resource-group "$BICEP_RG" \
            --template-file out/main.json --parameters out/params.json \
            --no-pretty-print > whatif.json
          bash ../stack-deletions.sh group "bicep-$LAYER" whatif.json "$BICEP_RG" > deletions.txt
          {
            echo
            echo "Resources the stack would DELETE (no longer in the template):"
            if [ -s deletions.txt ]; then cat deletions.txt; else echo "none"; fi
          } | tee -a plan.txt

      - name: Post what-if to the PR
        if: ${{ !cancelled() && steps.what-if.outcome != 'skipped' }}
        env:
          GH_TOKEN: ${{ github.token }}
          LAYER: ${{ matrix.layer }}
          OUTCOME: ${{ steps.what-if.outcome }}
          PR: ${{ github.event.pull_request.number }}
          SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          # One comment per layer, updated in place on each push to the PR.
          marker="<!-- bicep-what-if:${LAYER} -->"
          {
            echo "$marker"
            echo "### Bicep what-if: \`${LAYER}\` (${OUTCOME})"
            echo
            echo "Template: \`${{ matrix.dir }}\` with \`${{ matrix.params }}\`, commit ${{ github.event.pull_request.head.sha }}"
            echo
            echo '```'
            # PR comments aren't secret-masked the way logs are, and GitHub
            # caps a comment at 65536 characters.
            sed "s/${SUBSCRIPTION_ID:-no-subscription-id}/***/g" plan.txt | head -c 60000
            echo
            echo '```'
          } > comment.md

          existing=$(gh api "repos/${{ github.repository }}/issues/${PR}/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"${marker}\")) | .id" | head -n 1)

          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/${existing}" -F body=@comment.md > /dev/null
          else
            gh api -X POST "repos/${{ github.repository }}/issues/${PR}/comments" -F body=@comment.md > /dev/null
          fi

  # The check main's branch protection requires (named exactly `bicep-plan`,
  # alongside terraform-plan.yml's `plan`). Passes when every previewed layer
  # succeeded, or when nothing needed previewing.
  bicep-plan:
    needs: [changes, what-if-layer]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          WHAT_IF: ${{ needs.what-if-layer.result }}
        run: |
          echo "changes=$CHANGES what-if-layer=$WHAT_IF"
          [ "$CHANGES" = "success" ] && { [ "$WHAT_IF" = "success" ] || [ "$WHAT_IF" = "skipped" ]; }
